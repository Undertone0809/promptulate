[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pne"
version = "2.0.0"
description = "A new generation agent core."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2.30.0"]
anthropic = ["anthropic>=0.40.0"]
mcp = ["mcp>=1.0.0"]
notebook = ["nbformat>=5.0.0"]

[project.urls]
Homepage = "https://pne.zeeland.studio"

[tool.hatch.build.targets.wheel]
packages = ["src/pne"]
