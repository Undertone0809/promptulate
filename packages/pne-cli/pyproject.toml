[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pne-cli"
version = "2.0.0"
description = "Interactive CLI for the Pne local agent SDK."
requires-python = ">=3.13"
dependencies = ["pne>=2.0.0"]

[project.scripts]
pne = "pne_cli.__main__:main"

[project.urls]
Homepage = "https://example.com"

[tool.uv.sources]
pne = { workspace = true }
