name: Dependency refresh

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: dependency-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --quiet --upgrade pip pipx
          pipx install --quiet poetry==2.1.1
          pipx inject --quiet poetry poetry-plugin-export

      - name: Refresh dependency lock files
        run: |
          if ! poetry update --no-interaction --no-ansi > /tmp/poetry-update.log 2>&1; then
            cat /tmp/poetry-update.log
            exit 1
          fi
          poetry export --without-hashes --output requirements.txt
          poetry check --lock
          git diff --check
          git diff --stat -- poetry.lock requirements.txt

      - name: Commit refreshed lock files
        run: |
          if git diff --quiet -- poetry.lock requirements.txt; then
            echo "Dependency lock files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock requirements.txt
          git commit -m "chore(deps): refresh locked dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install development dependencies
        run: |
          if ! poetry install --with dev --no-interaction --no-ansi > /tmp/poetry-install.log 2>&1; then
            cat /tmp/poetry-install.log
            exit 1
          fi

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: poetry run pytest -q --tb=short --disable-warnings --cov=promptulate --cov-report=term tests/basic

      - name: Run style checks
        run: make check-codestyle

      - name: Build package
        run: poetry build
